<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<script>(function(){var t=localStorage.getItem('zenith-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zenith — Wyckoff / Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/sidebar.css">
<link rel="stylesheet" href="/static/components.css">
<style>
html, body { height: 100%; }
body.sidebar-layout { overflow: hidden; }
.main-content { overflow: hidden; display: flex; flex-direction: column; }
.page-body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.data-table { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.data-table-body { flex: 1; overflow-y: auto; min-height: 0; }

/* Table columns: # | Ticker | TX | Clean Money | SM | BM | RSM | Last | Phase | Action */
.flow-cols {
  grid-template-columns: 32px 1.2fr 0.35fr 0.85fr 0.7fr 0.7fr 0.55fr 0.82fr 1.15fr 0.8fr;
  column-gap: 8px;
}
</style>
</head>
<body class="sidebar-layout">
{% include 'sidebar.html' %}

<div class="main-content">

  <!-- Page Header -->
  <div class="page-header">
    <div>
      <div class="page-subtitle">Smart Money · Bad Money · Clean Money</div>
      <h1 class="page-title">Wyckoff Algo</h1>
    </div>
    <div class="page-header-actions">
      <div class="ihsg-pill">
        <span class="ihsg-pill-label">IHSG</span>
        <span class="ihsg-pill-price" id="ihsgPrice">—</span>
        <span class="ihsg-pill-gain" id="ihsgGain">—</span>
      </div>
    </div>
  </div>

  <!-- Page Body -->
  <div class="page-body">

    <!-- Stat Cards -->
    <div class="stat-cards-4" id="statCards">
      <div class="stat-card">
        <div class="stat-card-label">SM total</div>
        <div class="stat-card-value up" id="statSM">—</div>
        <div class="stat-card-sub" id="statSMCount">— stocks</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">BM total</div>
        <div class="stat-card-value down" id="statBM">—</div>
        <div class="stat-card-sub" id="statBMCount">— stocks</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Clean Money</div>
        <div class="stat-card-value" id="statCM">—</div>
        <div class="stat-card-sub">SM − BM</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">IHSG</div>
        <div class="stat-card-value ink" id="statIHSG">—</div>
        <div class="stat-card-sub up" id="statIHSGGain">—</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <!-- Search -->
      <div class="toolbar-search">
        <span class="toolbar-search-icon">⌕</span>
        <input type="text" id="tickerSearch" placeholder="Search ticker..." autocomplete="off" spellcheck="false"/>
        <button id="searchClear" style="display:none;background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0">✕</button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Date Picker -->
      <div id="datePicker"></div>

      <div class="toolbar-spacer"></div>

      <!-- Filter button -->
      <div class="filter-btn" id="filterBtn">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1 3h12M3 7h8M5 11h4"/></svg>
        Filters
        <span class="filter-badge" id="filterBadge" style="display:none">0</span>
        <span style="font-size:10px;margin-left:2px" id="filterChevron">▼</span>
        <div class="filter-dropdown" id="filterDropdown" style="min-width:200px">
          <div style="font-size:10px;color:var(--muted);padding:4px 10px 2px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">Phase</div>
          <div id="phaseFilterOpts"></div>
          <div class="filter-sep"></div>
          <div style="font-size:10px;color:var(--muted);padding:4px 10px 2px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">Action</div>
          <div id="actionFilterOpts"></div>
          <div class="filter-sep"></div>
          <button class="filter-clear" id="filterClear" style="color:var(--text-dim)">Clear all</button>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="data-table" id="dataTable">
      <div class="data-table-head flow-cols">
        <div>#</div>
        <div class="th-sortable" data-col="ticker" style="justify-content:flex-start">Ticker <span class="sort-arrow">↓</span></div>
        <div class="th-sortable" data-col="tx" style="text-align:right">TX <span class="sort-arrow">↓</span></div>
        <div class="th-sortable active" data-col="clean_money">
          Clean Money <span class="sort-arrow">↓</span>
        </div>
        <div class="th-sortable" data-col="sm_val" style="text-align:right">SM <span class="sort-arrow">↓</span></div>
        <div class="th-sortable" data-col="bm_val" style="text-align:right">BM <span class="sort-arrow">↓</span></div>
        <div class="th-sortable" data-col="rsm" style="text-align:right">
          RSM <span class="sort-arrow">↓</span>
        </div>
        <div class="th-sortable" data-col="gain_pct" style="text-align:right">Last <span class="sort-arrow">↓</span></div>
        <div class="th-sortable" data-col="phase" style="justify-content:center">Phase <span class="sort-arrow">↓</span></div>
        <div class="th-sortable" data-col="action" style="justify-content:center">Action <span class="sort-arrow">↓</span></div>
      </div>
      <div class="data-table-body" id="tableBody">
        <div style="padding:48px 0;text-align:center;color:var(--muted);font-size:13px">
          Loading...
        </div>
      </div>
      <div class="data-table-foot">
        <span id="rowCount">—</span>
        <div style="display:flex;align-items:center;gap:10px">
          <span id="liveTs" style="font-family:var(--font-mono);font-size:10.5px;color:var(--muted)"></span>
        </div>
      </div>
    </div>

  </div><!-- /page-body -->
</div><!-- /main-content -->

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box" style="width:min(90vw,520px)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div id="detailTitle" style="font-size:16px;font-weight:600;color:var(--ink)"></div>
      <button onclick="closeDetail()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1">✕</button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<script src="/static/zenith-utils.js"></script>
<script>
(function(){

/* ── State ── */
var state = {
  rows: [], filtered: [], dateFrom: '', dateTo: '',
  sortCol: 'clean_money', sortAsc: false,
  q: '', filterPhases: [], filterActions: [],
  liveDate: null
};

/* ── Today ── */
var today = window.todayLocal();
state.dateFrom = today;
state.dateTo   = today;

/* ── Date Picker ── */
var sdp = new window.StockbitDatePicker('datePicker', {
  from: today, to: today,
  onChange: function(from, to) {
    state.dateFrom = from;
    state.dateTo   = to;
    loadData();
  }
});
function fetchLastDate(cb){fetch('/api/last-date',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){if(d.date){var iso=window.DD_MM_YYYYtoISO(d.date.replace(/\//g,'-'));cb(iso);}}).catch(function(){});}
fetchLastDate(function(iso){state.liveDate=iso;state.dateFrom=iso;state.dateTo=iso;sdp.setDates(iso,iso);loadData();});
setTimeout(function(){if(!state.liveDate){state.liveDate=today;loadData();}},1500);

/* ── IHSG ── */
window.loadIHSGBadge(
  document.getElementById('ihsgPrice'),
  document.getElementById('ihsgGain')
);
window.loadIHSGBadge(
  document.getElementById('statIHSG'),
  document.getElementById('statIHSGGain')
);

/* ── Search ── */
var searchEl = document.getElementById('tickerSearch');
var clearBtn = document.getElementById('searchClear');
searchEl.addEventListener('input', function() {
  state.q = this.value.toUpperCase().trim();
  clearBtn.style.display = state.q ? 'inline' : 'none';
  applyFilter();
});
clearBtn.addEventListener('click', function() {
  searchEl.value = '';
  state.q = '';
  clearBtn.style.display = 'none';
  applyFilter();
});

/* ── Sort headers ── */
var _colLabels = {
  'clean_money': 'Clean Money', 'rsm': 'RSM', 'sm_val': 'SM', 'bm_val': 'BM',
  'tx': 'TX', 'price': 'Price', 'gain_pct': 'Last', 'ticker': 'Ticker',
  'phase': 'Phase', 'action': 'Action'
};
document.querySelectorAll('.th-sortable').forEach(function(th) {
  th.addEventListener('click', function() {
    var col = th.dataset.col;
    if (state.sortCol === col) { state.sortAsc = !state.sortAsc; }
    else { state.sortCol = col; state.sortAsc = false; }
    document.querySelectorAll('.th-sortable').forEach(function(el) {
      el.classList.remove('active');
      el.querySelector('.sort-arrow').textContent = '↓';
    });
    th.classList.add('active');
    th.querySelector('.sort-arrow').textContent = state.sortAsc ? '↑' : '↓';
    applyFilter();
  });
});

/* ── Filters ── */
var filterBtn = document.getElementById('filterBtn');
var filterDD  = document.getElementById('filterDropdown');
filterBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  filterDD.classList.toggle('open');
  document.getElementById('filterChevron').textContent = filterDD.classList.contains('open') ? '▲' : '▼';
});
document.addEventListener('mousedown', function(e) {
  if (!filterBtn.contains(e.target)) {
    filterDD.classList.remove('open');
    document.getElementById('filterChevron').textContent = '▼';
  }
});

document.getElementById('filterClear').addEventListener('click', function(e) {
  e.stopPropagation();
  state.filterPhases = [];
  state.filterActions = [];
  document.querySelectorAll('#phaseFilterOpts .filter-checkbox, #actionFilterOpts .filter-checkbox')
    .forEach(function(cb) { cb.classList.remove('checked'); });
  updateFilterBadge();
  applyFilter();
});

function updateFilterBadge() {
  var count = state.filterPhases.length + state.filterActions.length;
  var badge = document.getElementById('filterBadge');
  badge.textContent = count;
  badge.style.display = count ? 'flex' : 'none';
  filterBtn.classList.toggle('has-filters', count > 0);
}

function buildFilterOpts() {
  var phases  = [];
  var actions = [];
  state.rows.forEach(function(r) {
    if (r.phase  && phases.indexOf(r.phase)  < 0) phases.push(r.phase);
    if (r.action && actions.indexOf(r.action) < 0) actions.push(r.action);
  });
  phases.sort(); actions.sort();

  function makeOpts(items, group, selectedArr, containerId) {
    var html = items.map(function(v) {
      var active = selectedArr.indexOf(v) >= 0;
      return '<div class="filter-opt" data-group="' + group + '" data-val="' + v + '">' +
        '<div class="filter-checkbox' + (active ? ' checked' : '') + '"></div>' + v +
      '</div>';
    }).join('');
    document.getElementById(containerId).innerHTML = html;
    document.querySelectorAll('#' + containerId + ' .filter-opt').forEach(function(opt) {
      opt.addEventListener('click', function(e) {
        e.stopPropagation();
        var val = opt.dataset.val;
        var arr = group === 'phase' ? state.filterPhases : state.filterActions;
        var idx = arr.indexOf(val);
        if (idx >= 0) arr.splice(idx, 1); else arr.push(val);
        opt.querySelector('.filter-checkbox').classList.toggle('checked', arr.indexOf(val) >= 0);
        updateFilterBadge();
        applyFilter();
      });
    });
  }
  makeOpts(phases,  'phase',  state.filterPhases,  'phaseFilterOpts');
  makeOpts(actions, 'action', state.filterActions, 'actionFilterOpts');
}

/* ── Apply filter & sort ── */
function applyFilter() {
  var rows = state.rows.slice();
  if (state.q) rows = rows.filter(function(r){ return r.ticker.startsWith(state.q); });
  if (state.filterPhases.length)  rows = rows.filter(function(r){ return state.filterPhases.indexOf(r.phase) >= 0; });
  if (state.filterActions.length) rows = rows.filter(function(r){ return state.filterActions.indexOf(r.action) >= 0; });

  var col = state.sortCol;
  rows.sort(function(a, b) {
    if (col === 'ticker' || col === 'phase' || col === 'action') {
      var av = a[col] || '', bv = b[col] || '';
      return state.sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    var av = a[col] != null ? a[col] : -999999;
    var bv = b[col] != null ? b[col] : -999999;
    return state.sortAsc ? av - bv : bv - av;
  });
  state.filtered = rows;
  renderTable();
}

/* ── Render ── */
function renderTable() {
  var body = document.getElementById('tableBody');
  var rows = state.filtered;
  if (!rows.length) {
    body.innerHTML = '<div style="padding:48px 0;text-align:center;color:var(--muted);font-size:13px">No data for this filter.</div>';
    document.getElementById('rowCount').textContent = '0 of ' + state.rows.length + ' stocks';
    return;
  }

  var maxCM = rows.reduce(function(m,r){ return Math.max(m, Math.abs(r.clean_money||0)); }, 1);

  var html = rows.map(function(r, i) {
    var cm   = r.clean_money;
    var cmUp = cm != null && cm >= 0;
    var rsmColor = r.rsm != null && r.rsm > 60 ? 'var(--up)' : 'var(--text-dim)';

    return '<div class="data-table-row flow-cols" onclick="openDetail(' + JSON.stringify(r).replace(/"/g,'&quot;') + ')">' +
      '<div class="row-num' + (i < 3 ? ' top3' : '') + '">' + String(i+1).padStart(2,'0') + '</div>' +
      '<div class="ticker-cell">' +
        '<div class="ticker-cell-info">' +
          '<div class="ticker-cell-name">' + r.ticker + '</div>' +
          '<div class="ticker-cell-sub">' + (r.name || '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div style="text-align:right;font-family:var(--font-mono);font-size:13px;color:' + (r.tx >= 15 ? 'var(--ink)' : 'var(--text-dim)') + ';font-weight:' + (r.tx >= 15 ? '700' : '400') + '">' + (r.tx || '—') + '</div>' +
      '<div style="text-align:right;font-family:var(--font-mono);font-size:13px;font-weight:600;color:' + (cmUp ? 'var(--up)' : 'var(--down)') + '">' + (cm != null ? window.fmtMoneySign(cm) : '—') + '</div>' +
      '<div style="text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--up)">' + (r.sm_val != null ? window.fmtMoney(r.sm_val) : '—') + '</div>' +
      '<div style="text-align:right;font-family:var(--font-mono);font-size:12px;color:#e07840">' + (r.bm_val != null ? window.fmtMoney(r.bm_val) : '—') + '</div>' +
      '<div style="text-align:right;font-family:var(--font-mono);font-size:13px;color:' + rsmColor + '">' + (r.rsm != null ? r.rsm.toFixed(1) + '%' : '—') + '</div>' +
      '<div class="price-cell">' +
        '<div class="price-cell-price">' + (r.price ? window.fmtPrice(r.price) : '—') + '</div>' +
        '<div class="price-cell-chg ' + (r.gain_pct >= 0 ? 'up' : 'down') + '">' + (r.gain_pct != null ? window.fmtPct(r.gain_pct) : '—') + '</div>' +
      '</div>' +
      '<div style="display:flex;justify-content:center">' + window.phaseBadgeHTML(r.phase) + '</div>' +
      '<div style="display:flex;justify-content:center">' + window.actionBadgeHTML(r.action) + '</div>' +
    '</div>';
  }).join('');

  body.innerHTML = html;
  document.getElementById('rowCount').textContent = rows.length + ' of ' + state.rows.length + ' stocks';
}

/* ── Load data ── */
function fetchData(silent) {
  var body = document.getElementById('tableBody');
  if (!silent) body.innerHTML = '<div style="padding:48px 0;text-align:center;color:var(--muted);font-size:13px">Loading...</div>';

  var from = window.isoToDD_MM_YYYY(state.dateFrom);
  var to   = window.isoToDD_MM_YYYY(state.dateTo);
  var url  = '/api/flow?date_from=' + encodeURIComponent(from) + '&date_to=' + encodeURIComponent(to);

  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(d) {
      state.rows = (d.tickers || []).map(function(r) {
        return Object.assign({ name: '' }, r);
      });
      buildFilterOpts();
      var totals = d.totals || {};
      var smTotal  = totals.sm   || 0;
      var bmTotal  = totals.bm   || 0;
      var cmTotal  = totals.net_cm || 0;
      var smCount  = state.rows.filter(function(r){ return (r.sm_val||0) > 0; }).length;
      var bmCount  = state.rows.filter(function(r){ return (r.bm_val||0) > 0; }).length;

      document.getElementById('statSM').textContent       = '+' + window.fmtMoney(smTotal);
      document.getElementById('statSMCount').textContent  = smCount + ' stocks';
      document.getElementById('statBM').textContent       = window.fmtMoney(bmTotal);
      document.getElementById('statBMCount').textContent  = bmCount + ' stocks';
      var cmEl = document.getElementById('statCM');
      cmEl.textContent = (cmTotal >= 0 ? '+' : '') + window.fmtMoney(cmTotal);
      cmEl.className   = 'stat-card-value ' + (cmTotal >= 0 ? 'up' : 'down');

      var liveEl = document.getElementById('liveTs');
      if (liveEl) { var now = new Date(); liveEl.textContent = 'Update ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0'); }

      applyFilter();
    })
    .catch(function(err) {
      if (!silent) body.innerHTML = '<div style="padding:48px 0;text-align:center;color:var(--muted);font-size:13px">Failed to load data.</div>';
    });
}
function loadData() { fetchData(false); }

/* ── Detail Modal ── */
function openDetail(r) {
  var modal = document.getElementById('detailModal');
  var title = document.getElementById('detailTitle');
  var body  = document.getElementById('detailBody');

  title.innerHTML = '<span>' + r.ticker + '</span>' +
    (r.phase ? '&nbsp;' + window.phaseBadgeHTML(r.phase) : '') +
    (r.action ? '&nbsp;' + window.actionBadgeHTML(r.action) : '');
  title.style.display = 'flex';
  title.style.alignItems = 'center';

  var rows2 = [
    ['Price', r.price ? window.fmtPrice(r.price) : '—', r.gain_pct != null ? window.fmtPct(r.gain_pct) : '', r.gain_pct >= 0 ? 'up' : 'down'],
    ['Smart Money', r.sm_val != null ? '+'+window.fmtMoney(r.sm_val) : '—', r.tx_sm ? r.tx_sm+' TX' : '', 'up'],
    ['Bad Money', r.bm_val != null ? window.fmtMoney(r.bm_val) : '—', r.tx_bm ? r.tx_bm+' TX' : '', 'down'],
    ['Clean Money', r.clean_money != null ? window.fmtMoneySign(r.clean_money) : '—', 'SM − BM', r.clean_money >= 0 ? 'up' : 'down'],
    ['RSM', r.rsm != null ? r.rsm.toFixed(1)+'%' : '—', '', r.rsm >= 60 ? 'up' : 'dim'],
    ['TX Total', r.tx || '—', 'frequency', ''],
  ];

  body.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
    rows2.map(function(row){
      return '<div style="padding:10px 12px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)">' +
        '<div style="font-size:11px;color:var(--text-dim)">' + row[0] + '</div>' +
        '<div style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--' + (row[3]||'ink') + ');margin-top:2px">' + row[1] + '</div>' +
        (row[2] ? '<div style="font-size:11px;color:var(--muted);margin-top:1px">' + row[2] + '</div>' : '') +
      '</div>';
    }).join('') +
  '</div>';

  if (r.narrative) {
    body.innerHTML += '<div style="margin-top:12px;padding:12px 14px;background:var(--accent-soft);border-radius:8px;font-size:12.5px;color:var(--text-dim);line-height:1.5">' + r.narrative + '</div>';
  }

  modal.classList.add('open');
}
window.openDetail = openDetail;

function closeDetail() {
  document.getElementById('detailModal').classList.remove('open');
}
window.closeDetail = closeDetail;

document.getElementById('detailModal').addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});

/* ── Init ── */
setInterval(function(){
  fetchLastDate(function(iso){
    var wasLive = (state.dateFrom === state.liveDate);
    if (iso !== state.liveDate && wasLive) {
      state.liveDate = iso;
      state.dateFrom = iso;
      state.dateTo   = iso;
      sdp.setDates(iso, iso);
    } else {
      state.liveDate = iso;
    }
    if (state.dateFrom === state.liveDate) fetchData(true);
  });
}, 60000);

})();
</script>
</body>
</html>
